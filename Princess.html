<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Princess</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #2f243a;
      background: linear-gradient(hsl(207, 90%, 66%));
      display: flex;
      align-items: center;
      justify-content: center
    }

    main {
      width: min(90%, 720px);
      padding: 32px;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid #ffffff;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(80, 54, 105, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
      color: #7f3f76;
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 20px;
      color: #ffffff;
      background: hsl(207, 90%, 66%);
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #68c2fa;
    }
  </style>
</head>
<body>
  <main>
    <h1>Princess </h1>
    <p>
      Welcome to my Act#3
    </p>
    <a class="button" href="#">Begin</a>
  </main>
</body>
</html>
